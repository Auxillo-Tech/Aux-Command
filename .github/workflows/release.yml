name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  linux-x64:
    name: Linux x64 release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            xz-utils \
            python3 \
            iputils-ping \
            traceroute \
            dnsutils \
            whois \
            socat

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency graphs and registry signatures
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
          npm audit signatures

      - name: Run validation suite
        run: npm run check

      - name: Import and verify release signing key
        id: signing
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.AUX_COMMAND_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # When the signing secret is absent, publish an unsigned (checksummed)
          # engineering release instead of failing the whole release. Add the
          # AUX_COMMAND_GPG_PRIVATE_KEY secret to produce GPG-signed releases.
          if [[ -z "$RELEASE_PRIVATE_KEY" ]]; then
            echo "::warning::AUX_COMMAND_GPG_PRIVATE_KEY is not set; publishing an unsigned, checksummed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$RELEASE_PRIVATE_KEY" | gpg --batch --import
          expected="$(gpg --batch --with-colons --show-keys SIGNING_KEY.asc | awk -F: '$1=="fpr" {print toupper($10); exit}')"
          actual="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print toupper($10); exit}')"
          [[ -n "$expected" && "$actual" == "$expected" ]] || { echo "Release signing key does not match SIGNING_KEY.asc" >&2; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"

      - name: Build AppImage, deb and rpm
        run: npm run dist:x64 -- --publish never

      - name: Build corresponding source archives
        run: bash scripts/source-archives.sh

      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            node scripts/release-manifest.cjs --key "${{ steps.signing.outputs.fingerprint }}"
          else
            node scripts/release-manifest.cjs --no-sign
          fi

      - name: Verify release integrity
        shell: bash
        env:
          AUX_COMMAND_GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            npm run release:verify
          else
            node scripts/verify-release.cjs --allow-unsigned
          fi

      - name: Verify source archive exclusions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tar -tzf "dist/aux-command-${version}-source.tar.gz" | grep -E '(^|/)(node_modules|dist|\.cache|__pycache__)(/|$)|\.py[co]$' && exit 1 || true
          unzip -Z1 "dist/aux-command-${version}-source.zip" | grep -E '(^|/)(node_modules|dist|\.cache|__pycache__)(/|$)|\.py[co]$' && exit 1 || true

      - name: Attest release artifacts
        if: github.event.repository.private == false
        continue-on-error: true
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.AppImage
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.deb
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.rpm
            dist/aux-command-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/aux-command-${{ steps.version.outputs.version }}-source.tar.gz
            dist/aux-command-${{ steps.version.outputs.version }}-source.zip
            dist/latest*.yml
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/*.asc

      - name: Upload workflow artifacts
        if: github.ref_type == 'tag'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aux-command-linux-x64-${{ github.ref_name }}
          retention-days: 5
          if-no-files-found: error
          path: |
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.AppImage
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.deb
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.rpm
            dist/aux-command-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/aux-command-${{ steps.version.outputs.version }}-source.tar.gz
            dist/aux-command-${{ steps.version.outputs.version }}-source.zip
            dist/latest*.yml
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/*.asc

      - name: Publish authenticated GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          title="Aux Command ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" || true
          else
            gh release create "$tag" --verify-tag --title "$title" --generate-notes
          fi
          # Upload only files that were actually produced. The detached
          # signature (.asc) files exist only for signed releases, and literal
          # (non-glob) paths are not removed by nullglob, so guard with -e.
          shopt -s nullglob
          assets=()
          for pattern in \
            "dist/Aux-Command-${version}-"*.AppImage \
            "dist/Aux-Command-${version}-"*.deb \
            "dist/Aux-Command-${version}-"*.rpm \
            "dist/aux-command-${version}-sbom.cdx.json" \
            "dist/aux-command-${version}-source.tar.gz" \
            "dist/aux-command-${version}-source.zip" \
            "dist/latest"*.yml \
            "dist/release-manifest.json" \
            "dist/release-manifest.json.asc" \
            "dist/SHA256SUMS" \
            "dist/SHA256SUMS.asc"; do
            for f in $pattern; do [ -e "$f" ] && assets+=("$f"); done
          done
          [ "${#assets[@]}" -gt 0 ] || { echo "No release assets were produced" >&2; exit 1; }
          gh release upload "$tag" "${assets[@]}" --clobber
