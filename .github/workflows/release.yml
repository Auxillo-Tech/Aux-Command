name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  # Built and tested natively on GitHub's hosted arm64 runner. This job has no
  # access to the signing key or to the release: it hands its packages to the
  # x64 job, which writes and signs one manifest for both architectures.
  linux-arm64:
    name: Linux arm64 packages
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            xz-utils \
            python3 \
            iputils-ping \
            traceroute \
            dnsutils \
            whois \
            socat openssh-server mosh xvfb xauth x11vnc x11-utils \
            freerdp2-x11 freerdp2-shadow-x11 python3-venv libgtk-3-0t64 clang
          sudo mkdir -p /run/sshd

      - name: Prepare isolated protocol test environment
        run: |
          python3 -m venv /tmp/aux-protocol-venv
          /tmp/aux-protocol-venv/bin/pip install pyftpdlib==2.2.0 pyOpenSSL==26.4.0 websocket-client==1.9.2

      - name: Install dependencies
        run: npm ci

      - name: Install locked Electron runtime
        run: node node_modules/electron/install.js

      - name: Enable the Electron SUID sandbox helper on the runner
        run: bash scripts/ci-enable-electron-sandbox.sh

      - name: Run validation suite
        run: npm run check

      - name: Qualify local protocol connections and recovery
        env:
          AUX_FTP_TEST_PYTHON: /tmp/aux-protocol-venv/bin/python
        run: bash scripts/qualify-linux.sh

      - name: Test import/export, recovery, keyboard access and session soak
        run: /tmp/aux-protocol-venv/bin/python scripts/run-ui-qualification.py

      - name: Build AppImage, deb and rpm
        run: npm run dist:arm64 -- --publish never

      - name: Verify installers on Debian, Ubuntu and Fedora
        run: bash scripts/test-installers.sh dist

      - name: Hand the arm64 packages to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aux-command-linux-arm64-packages
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/Aux-Command-*-arm64.AppImage
            dist/Aux-Command-*-arm64.deb
            dist/Aux-Command-*-aarch64.rpm
            dist/latest-linux-arm64.yml

  linux-x64:
    name: Linux x64 release artifacts
    needs: linux-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            xz-utils \
            python3 \
            iputils-ping \
            traceroute \
            dnsutils \
            whois \
            socat openssh-server mosh xvfb xauth x11vnc x11-utils \
            freerdp2-x11 freerdp2-shadow-x11 python3-venv libgtk-3-0t64 clang
          sudo mkdir -p /run/sshd

      - name: Prepare isolated protocol test environment
        run: |
          python3 -m venv /tmp/aux-protocol-venv
          /tmp/aux-protocol-venv/bin/pip install pyftpdlib==2.2.0 pyOpenSSL==26.4.0 websocket-client==1.9.2

      - name: Install dependencies
        run: npm ci

      - name: Install locked Electron runtime
        run: node node_modules/electron/install.js

      - name: Enable the Electron SUID sandbox helper on the runner
        run: bash scripts/ci-enable-electron-sandbox.sh

      - name: Audit dependency graphs and registry signatures
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
          npm audit signatures

      - name: Run validation suite
        run: npm run check

      - name: Qualify local protocol connections and recovery
        env:
          AUX_FTP_TEST_PYTHON: /tmp/aux-protocol-venv/bin/python
        run: bash scripts/qualify-linux.sh

      - name: Test import/export, recovery, keyboard access and session soak
        run: /tmp/aux-protocol-venv/bin/python scripts/run-ui-qualification.py

      - name: Build AppImage, deb and rpm
        run: CC=clang CXX=clang++ npm run dist:x64 -- --publish never

      - name: Verify installers on Debian, Ubuntu and Fedora
        run: bash scripts/test-installers.sh dist

      - name: Build corresponding source archives
        run: bash scripts/source-archives.sh

      # The arm64 packages were built and tested by the arm64 job. They join
      # this job's files before the manifest is written, so one signed manifest
      # and one release cover both architectures.
      - name: Add the arm64 packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aux-command-linux-arm64-packages
          path: dist

      # The private key is imported only after dependencies are installed and
      # packages are built and tested, so build tooling never runs with it.
      - name: Import and verify release signing key
        id: signing
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.AUX_COMMAND_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Tagged public releases must satisfy the application's trust policy.
          if [[ -z "$RELEASE_PRIVATE_KEY" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::A tagged release requires AUX_COMMAND_GPG_PRIVATE_KEY; refusing unsigned publication."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$RELEASE_PRIVATE_KEY" | gpg --batch --import
          expected="$(gpg --batch --with-colons --show-keys SIGNING_KEY.asc | awk -F: '$1=="fpr" {print toupper($10); exit}')"
          actual="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print toupper($10); exit}')"
          [[ -n "$expected" && "$actual" == "$expected" ]] || { echo "Release signing key does not match SIGNING_KEY.asc" >&2; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            node scripts/release-manifest.cjs --key "${{ steps.signing.outputs.fingerprint }}"
          else
            node scripts/release-manifest.cjs --no-sign
          fi

      - name: Verify release integrity
        shell: bash
        env:
          AUX_COMMAND_GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            npm run release:verify -- --require-arch x64,arm64
          else
            node scripts/verify-release.cjs --allow-unsigned --require-arch x64,arm64
          fi

      - name: Verify source archive exclusions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tar -tzf "dist/aux-command-${version}-source.tar.gz" | grep -E '(^|/)(node_modules|dist|\.cache|__pycache__)(/|$)|\.py[co]$' && exit 1 || true
          unzip -Z1 "dist/aux-command-${version}-source.zip" | grep -E '(^|/)(node_modules|dist|\.cache|__pycache__)(/|$)|\.py[co]$' && exit 1 || true

      - name: Attest release artifacts
        if: github.event.repository.private == false
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.AppImage
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.deb
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.rpm
            dist/aux-command-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/aux-command-${{ steps.version.outputs.version }}-source.tar.gz
            dist/aux-command-${{ steps.version.outputs.version }}-source.zip
            dist/latest*.yml
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/*.asc

      # A manual run from a branch is a dry run: it must leave the whole file
      # set downloadable, and a failed upload must fail it. On a tag the
      # publish step reads dist/ directly, so the upload stays non-blocking.
      - name: Upload workflow artifacts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        continue-on-error: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aux-command-linux-x64-${{ github.ref_name }}
          retention-days: 5
          if-no-files-found: error
          path: |
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.AppImage
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.deb
            dist/Aux-Command-${{ steps.version.outputs.version }}-*.rpm
            dist/aux-command-${{ steps.version.outputs.version }}-sbom.cdx.json
            dist/aux-command-${{ steps.version.outputs.version }}-source.tar.gz
            dist/aux-command-${{ steps.version.outputs.version }}-source.zip
            dist/latest*.yml
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/*.asc

      - name: Publish authenticated GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          title="Aux Command ${tag}"
          # The release stays a draft until every file is attached, then is
          # published in one step. Installed copies check the latest published
          # release for updates, so they never see a release without its
          # signed manifest, and a published release is never modified
          # (release immutability can be enabled on the repository).
          # One lookup decides the path. Only gh's "release not found" means
          # there is no release; any other failure stops the run, so a lookup
          # error can never lead to a published release being modified.
          view_err="${RUNNER_TEMP}/release-view.err"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>"$view_err")"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release ${tag} is already published. Published releases are not modified; publish a new version instead." >&2
              exit 1
            fi
          elif grep -q 'release not found' "$view_err"; then
            gh release create "$tag" --verify-tag --draft --title "$title" --generate-notes
          else
            cat "$view_err" >&2
            exit 1
          fi
          # Upload only files that were actually produced. The detached
          # signature (.asc) files exist only for signed releases, and literal
          # (non-glob) paths are not removed by nullglob, so guard with -e.
          shopt -s nullglob
          assets=()
          for pattern in \
            "dist/Aux-Command-${version}-"*.AppImage \
            "dist/Aux-Command-${version}-"*.deb \
            "dist/Aux-Command-${version}-"*.rpm \
            "dist/aux-command-${version}-sbom.cdx.json" \
            "dist/aux-command-${version}-source.tar.gz" \
            "dist/aux-command-${version}-source.zip" \
            "dist/latest"*.yml \
            "dist/release-manifest.json" \
            "dist/release-manifest.json.asc" \
            "dist/SHA256SUMS" \
            "dist/SHA256SUMS.asc"; do
            for f in $pattern; do [ -e "$f" ] && assets+=("$f"); done
          done
          [ "${#assets[@]}" -gt 0 ] || { echo "No release assets were produced" >&2; exit 1; }
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --latest

      - name: Remove release signing key
        if: always()
        shell: bash
        run: rm -rf "${GNUPGHOME:-$HOME/.gnupg}"
