name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the attest job (tags and manual runs) gets the
# OIDC and attestation permissions, never pull requests.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux packaging and diagnostics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            rpm \
            libarchive-tools \
            xz-utils \
            iputils-ping \
            traceroute \
            dnsutils \
            whois \
            socat openssh-server mosh xvfb xauth x11vnc x11-utils \
            freerdp2-x11 freerdp2-shadow-x11 python3-venv libgtk-3-0t64 clang
          sudo mkdir -p /run/sshd

      - name: Prepare isolated protocol test environment
        run: |
          python3 -m venv /tmp/aux-protocol-venv
          /tmp/aux-protocol-venv/bin/pip install pyftpdlib==2.2.0 pyOpenSSL==26.4.0 websocket-client==1.9.2

      - name: Install JavaScript dependencies deterministically
        run: npm ci

      - name: Install locked Electron runtime
        run: node node_modules/electron/install.js

      - name: Validate source and tests
        run: npm run check

      - name: Qualify local protocol connections and recovery
        env:
          AUX_FTP_TEST_PYTHON: /tmp/aux-protocol-venv/bin/python
        run: bash scripts/qualify-linux.sh

      - name: Test import/export, recovery, keyboard access and session soak
        run: /tmp/aux-protocol-venv/bin/python scripts/run-ui-qualification.py

      - name: Audit dependency vulnerabilities and registry signatures
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit signatures

      - name: Build x64 Linux packages and production SBOM without publishing
        run: CC=clang CXX=clang++ npm run dist:x64 -- --publish never

      - name: Verify installers on Debian, Ubuntu and Fedora
        run: bash scripts/test-installers.sh dist

      - name: Build source archives
        run: bash scripts/source-archives.sh

      - name: Generate and verify unsigned CI release metadata
        run: |
          npm run release:manifest -- --no-sign
          npm run release:verify -- --allow-unsigned

      # Full package artifacts are ~330MB each. Uploading on every main push exhausted
      # GitHub Actions artifact storage and failed otherwise-green builds. Keep build
      # verification on every push; only upload on tags or manual dispatch.
      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aux-command-linux-x64
          retention-days: 5
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*-sbom.cdx.json
            dist/*-source.tar.gz
            dist/*-source.zip
            dist/latest*.yml
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error

  attest:
    needs: test-and-build
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aux-command-linux-x64
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*-sbom.cdx.json
            dist/*-source.tar.gz
            dist/*-source.zip
            dist/latest*.yml
            dist/SHA256SUMS
            dist/release-manifest.json
