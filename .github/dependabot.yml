version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      electron-runtime:
        patterns:
          - electron
          - electron-builder
          - electron-updater
          - app-builder-lib
      xterm:
        patterns:
          - "@xterm/*"
    commit-message:
      prefix: deps
