<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src ws://127.0.0.1:*; img-src data:">
<title>Aux Command VNC</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050b10; color: #dcecf4; font-family: system-ui, sans-serif; }
#vnc-screen { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#vnc-screen canvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
#vnc-status { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 12px; background: rgba(5, 11, 16, .88); color: #748d9b; font-size: 10px; font-family: monospace; border-top: 1px solid rgba(185, 198, 222, .1); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 11, 16, .96); z-index: 2; }
.overlay[hidden] { display: none; }
.card { min-width: 280px; max-width: 420px; padding: 18px 24px; border: 1px solid rgba(89, 223, 255, .22); border-radius: 8px; background: #0a161f; }
.card strong { display: block; color: #59dfff; font-size: 12px; margin-bottom: 6px; }
.card p { color: #9db2be; font-size: 11px; margin: 0 0 12px; }
#error-overlay .card { border-color: rgba(255, 113, 133, .3); }
#error-overlay strong { color: #ff7185; }
#error-detail { color: #ffb1bd; font-size: 10px; }
label { display: block; margin-bottom: 6px; color: #9db2be; font-size: 11px; }
input { width: 100%; border: 1px solid #29404d; border-radius: 5px; padding: 8px; color: #e8f4fa; background: #071018; }
button { margin-top: 10px; border: 0; border-radius: 5px; padding: 8px 12px; background: #22aeca; color: #041015; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="connecting-overlay" class="overlay"><div class="card"><strong>Connecting</strong><p>Opening the VNC session...</p></div></div>
<div id="credentials-overlay" class="overlay" hidden>
  <form id="credentials-form" class="card">
    <strong>VNC authentication</strong>
    <p>Enter the password required by this VNC server. It stays in this session only.</p>
    <label for="vnc-password">Password</label>
    <input id="vnc-password" type="password" autocomplete="current-password" required>
    <button type="submit">Continue</button>
  </form>
</div>
<div id="error-overlay" class="overlay" hidden><div class="card"><strong>VNC connection failed</strong><span id="error-detail"></span></div></div>
<div id="vnc-screen" aria-label="Remote VNC desktop"></div>
<div id="vnc-status" role="status" aria-live="polite">Initializing...</div>
<script type="module" src="./vnc.js"></script>
</body>
</html>
